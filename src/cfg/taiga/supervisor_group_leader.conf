; Per-system supervisor group. The [program:*] definitions live in the
; shared tmux/crewed/leader/supervisor.conf; this file names the group the
; operators address (supervisorctl restart taiga:*) and lists which of the
; shared programs this system actually runs. supervisord merges every
; file matched by [include] in supervisord.conf, so a group here can
; reference programs defined there.

[group:taiga]
programs=ins,daq,cam_param_monitor,fps_monitor,shapefile_monitor,cam_ir,cam_uv,cam_rgb,imageview,detector
