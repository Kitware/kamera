# Binary deps (GDAL, pycolmap) with no reliable cross-platform wheels.
# `make install` layers the rest on top; see README.md for setup.
name: kamera
channels:
  - conda-forge
dependencies:
  - python=3.13  # must match PYTHON_VERSION in the Makefile (pycolmap>=4.2 needs 3.11+)
  - gdal>=3.10
  - pycolmap>=4.2
  - pip
  - uv
